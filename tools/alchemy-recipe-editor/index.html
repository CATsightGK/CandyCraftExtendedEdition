<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CandyCraft 配方编辑器</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">CC</span><div><h1>CandyCraft 配方编辑器</h1><p id="workspace">正在读取工作区</p></div></div>
    <div class="toolbar">
      <button id="newButton" title="新建配方">＋ 新建</button>
      <button id="duplicateButton" title="复制当前配方">复制</button>
      <button id="deleteButton" class="danger" title="删除当前配方">删除</button>
      <button id="saveButton" class="primary" title="保存配方">保存</button>
    </div>
  </header>
  <nav id="machineTabs" class="machine-tabs" aria-label="配方类型"></nav>
  <main class="workspace">
    <aside class="recipe-sidebar">
      <div class="sidebar-head"><strong id="recipeCount">0 条配方</strong><input id="searchInput" type="search" placeholder="搜索配方 ID"></div>
      <div id="recipeList" class="recipe-list"></div>
    </aside>
    <section class="editor-pane">
      <div class="editor-heading"><div><span id="editorKind" class="eyebrow"></span><h2 id="editorTitle">新配方</h2></div><span id="fileLabel" class="file-label">尚未保存</span></div>
      <div id="editor"></div>
    </section>
  </main>
  <div id="status" role="status" aria-live="polite"></div>
  <script>
    const categories = [
      ["workbench", "工作台"], ["smelting", "甘草熔炉"], ["fuel", "熔炉燃料"],
      ["alchemy", "搅拌锅"], ["sugar_factory", "制糖机"]
    ];
    const categoryNames = Object.fromEntries(categories);
    const state = { category: "workbench", recipes: {}, items: [], tags: [], effects: [], liquids: [], current: null, previousFile: null };
    const $ = id => document.getElementById(id);
    const clone = value => JSON.parse(JSON.stringify(value));
    const ticks = seconds => Math.max(1, Math.round(Number(seconds || 0) * 20));
    const seconds = ticksValue => Number((Number(ticksValue || 0) / 20).toFixed(2));

    function node(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    async function api(route, payload) {
      const response = await fetch(route, payload ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) } : {});
      const value = await response.json();
      if (!response.ok || value.ok === false) throw new Error(value.error || "操作失败");
      return value;
    }

    function status(message, error = false) {
      $("status").textContent = message;
      $("status").className = error ? "show error" : "show";
      clearTimeout(status.timer);
      status.timer = setTimeout(() => $("status").className = "", 3600);
    }

    function input(type, value, onChange, options = {}) {
      const element = document.createElement("input");
      element.type = type; element.value = value ?? "";
      for (const [key, option] of Object.entries(options)) element[key] = option;
      element.addEventListener("input", () => onChange(type === "number" ? Number(element.value) : element.value));
      return element;
    }

    function select(value, entries, onChange) {
      const element = document.createElement("select");
      for (const [id, label] of entries) {
        const option = document.createElement("option"); option.value = id; option.textContent = label; element.append(option);
      }
      element.value = value;
      element.addEventListener("change", () => onChange(element.value));
      return element;
    }

    function field(label, control, className = "") {
      const wrapper = node("label", `field ${className}`); wrapper.append(node("span", "field-label", label), control); return wrapper;
    }

    function closeMenus(except) {
      document.querySelectorAll(".resource-menu.open").forEach(menu => { if (menu !== except) menu.classList.remove("open"); });
    }

    function resourceField(value, onChange, source = "item", compact = false) {
      const wrapper = node("div", `resource-field${compact ? " compact" : ""}`);
      const icon = node("span", "resource-icon");
      const text = input("text", value || "", next => { onChange(next); updateIcon(); renderOptions(next); });
      text.placeholder = source === "tag" ? "namespace:tag" : source === "effect" ? "minecraft:effect" : "namespace:item";
      const toggle = node("button", "resource-toggle", "⌄"); toggle.type = "button"; toggle.title = "选择资源";
      const menu = node("div", "resource-menu");
      wrapper.append(icon, text, toggle, menu);

      function values() {
        if (source === "tag") return state.tags.map(id => ({ id, name: id }));
        if (source === "effect") return state.effects;
        return state.items;
      }
      function updateIcon() {
        const found = state.items.find(item => item.id === text.value.trim());
        icon.style.backgroundImage = source === "item" && found?.icon ? `url("${found.icon}")` : "";
        icon.textContent = source === "tag" ? "#" : source === "effect" ? "Fx" : found?.icon ? "" : "·";
      }
      function renderOptions(query = "") {
        const term = query.trim().toLowerCase(); menu.replaceChildren();
        const matches = values().filter(entry => !term || entry.id.toLowerCase().includes(term) || String(entry.name || "").toLowerCase().includes(term)).slice(0, 80);
        for (const entry of matches) {
          const option = node("button", "resource-option"); option.type = "button";
          if (entry.icon) { const image = document.createElement("img"); image.src = entry.icon; image.alt = ""; option.append(image); }
          else option.append(node("span", "option-placeholder", source === "tag" ? "#" : ""));
          const labels = node("span", "option-labels"); labels.append(node("strong", "", entry.name || entry.id), node("small", "", entry.id)); option.append(labels);
          option.addEventListener("click", () => { text.value = entry.id; onChange(entry.id); updateIcon(); menu.classList.remove("open"); });
          menu.append(option);
        }
        menu.classList.toggle("open", document.activeElement === text || menu.classList.contains("open"));
      }
      text.addEventListener("focus", () => { closeMenus(menu); renderOptions(text.value); menu.classList.add("open"); });
      toggle.addEventListener("click", event => { event.stopPropagation(); const opening = !menu.classList.contains("open"); closeMenus(menu); if (opening) { renderOptions(""); menu.classList.add("open"); text.focus(); } });
      updateIcon(); return wrapper;
    }

    function ingredientControl(value, onChange, options = {}) {
      const current = value || { kind: "item", id: "" };
      const row = node("div", `ingredient-control${options.compact ? " compact" : ""}`);
      const kind = select(current.kind || "item", [["item", "物品"], ["tag", "标签"]], next => { current.kind = next; onChange(current); renderEditor(); });
      row.append(kind, resourceField(current.id, next => { current.id = next; onChange(current); }, current.kind, options.compact));
      return row;
    }

    function numberField(label, value, onChange, min = 0, max = 72000, step = 1, className = "") {
      return field(label, input("number", value, onChange, { min, max, step }), className);
    }

    function section(title) {
      const band = node("section", "editor-band"); band.append(node("h3", "", title)); return band;
    }

    function resultControls(recipe) {
      const resultBand = section("输出");
      const row = node("div", "form-row result-row");
      row.append(field("输出物品", resourceField(recipe.result.item, value => recipe.result.item = value), "grow"), numberField("数量", recipe.result.count, value => recipe.result.count = value, 1, 64));
      resultBand.append(row); return resultBand;
    }

    function idFields(recipe, includeGroup = true) {
      const row = node("div", "form-row identity-row");
      row.append(field("配方 ID", input("text", recipe.id, value => { recipe.id = value; updateHeading(); }), "grow"));
      if (includeGroup) row.append(field("配方组", input("text", recipe.group || "", value => recipe.group = value), "grow"));
      return row;
    }

    function segmented(value, entries, onChange) {
      const group = node("div", "segmented");
      for (const [id, label] of entries) {
        const button = node("button", id === value ? "active" : "", label); button.type = "button";
        button.addEventListener("click", () => onChange(id)); group.append(button);
      }
      return group;
    }

    function renderWorkbench(recipe, root) {
      const identity = section("基本信息"); identity.append(idFields(recipe));
      const meta = node("div", "form-row"); meta.append(field("配方书分类", select(recipe.book_category || "misc", [["building", "建筑"], ["equipment", "装备"], ["redstone", "红石"], ["misc", "杂项"]], value => recipe.book_category = value)), field("排列方式", segmented(recipe.mode, [["shaped", "有序 3×3"], ["shapeless", "无序材料"]], value => { recipe.mode = value; if (value === "shaped" && !recipe.cells) recipe.cells = Array(9).fill(null); if (value === "shapeless" && !recipe.ingredients) recipe.ingredients = []; renderEditor(); })));
      identity.append(meta); root.append(identity);
      const inputs = section("工作台输入");
      if (recipe.mode === "shaped") {
        const grid = node("div", "craft-grid");
        for (let index = 0; index < 9; index++) {
          const cell = node("div", "craft-cell");
          const value = recipe.cells[index] || { kind: "item", id: "" };
          cell.append(ingredientControl(value, next => recipe.cells[index] = next.id ? next : null, { compact: true }));
          const clear = node("button", "cell-clear", "×"); clear.type = "button"; clear.title = "清空格子"; clear.addEventListener("click", () => { recipe.cells[index] = null; renderEditor(); }); cell.append(clear); grid.append(cell);
        }
        inputs.append(grid);
      } else {
        const rows = node("div", "ingredient-rows");
        (recipe.ingredients || []).forEach((entry, index) => {
          const row = node("div", "ingredient-row");
          row.append(ingredientControl(entry, next => Object.assign(entry, next)), numberField("数量", entry.count || 1, value => entry.count = value, 1, 9).querySelector("input"));
          const remove = node("button", "icon-button danger", "×"); remove.type = "button"; remove.title = "删除材料"; remove.addEventListener("click", () => { recipe.ingredients.splice(index, 1); renderEditor(); }); row.append(remove); rows.append(row);
        });
        const add = node("button", "add-row", "＋ 添加材料"); add.type = "button"; add.addEventListener("click", () => { recipe.ingredients.push({ kind: "item", id: "minecraft:sugar", count: 1 }); renderEditor(); });
        inputs.append(rows, add);
      }
      root.append(inputs, resultControls(recipe));
    }

    function processDiagram(inputControl, middle, outputControl) {
      const diagram = node("div", "process-diagram");
      const inputSlot = node("div", "process-slot"); inputSlot.append(node("span", "slot-label", "输入"), inputControl);
      const process = node("div", "process-middle"); process.append(node("span", "process-arrow", "→"), middle);
      const outputSlot = node("div", "process-slot"); outputSlot.append(node("span", "slot-label", "输出"), outputControl);
      diagram.append(inputSlot, process, outputSlot); return diagram;
    }

    function renderSmelting(recipe, root) {
      const identity = section("基本信息"); identity.append(idFields(recipe));
      identity.append(field("配方书分类", select(recipe.book_category || "misc", [["blocks", "方块"], ["food", "食物"], ["misc", "杂项"]], value => recipe.book_category = value))); root.append(identity);
      const process = section("烧制流程");
      const middle = node("div", "process-settings"); middle.append(numberField("烧制秒数", seconds(recipe.cooking_time), value => recipe.cooking_time = ticks(value), .05, 3600, .05), numberField("经验", recipe.experience, value => recipe.experience = value, 0, 100, .1));
      const output = node("div", "output-stack"); output.append(resourceField(recipe.result.item, value => recipe.result.item = value), numberField("数量", recipe.result.count, value => recipe.result.count = value, 1, 64));
      process.append(processDiagram(ingredientControl(recipe.ingredient, next => recipe.ingredient = next), middle, output)); root.append(process);
    }

    function renderFuel(recipe, root) {
      const identity = section("燃料定义"); identity.append(idFields(recipe, false));
      const row = node("div", "form-row fuel-row"); row.append(field("燃料物品或标签", ingredientControl(recipe.ingredient, next => recipe.ingredient = next), "grow"), numberField("燃烧秒数", seconds(recipe.burn_time), value => recipe.burn_time = ticks(value), .05, 3600, .05)); identity.append(row); root.append(identity);
    }

    function renderSugarFactory(recipe, root) {
      const identity = section("基本信息"); identity.append(idFields(recipe, false));
      identity.append(field("可用机器", segmented(recipe.factory, [["normal", "普通"], ["advanced", "高级"], ["both", "两者"]], value => { recipe.factory = value; renderEditor(); }))); root.append(identity);
      const process = section("加工流程");
      const inputStack = node("div", "output-stack"); inputStack.append(ingredientControl(recipe.ingredient, next => recipe.ingredient = next), numberField("消耗数量", recipe.input_count, value => recipe.input_count = value, 1, 64));
      const middle = node("div", "process-settings"); middle.append(numberField("普通机秒数", seconds(recipe.processing_time), value => recipe.processing_time = ticks(value), .05, 3600, .05));
      const outputStack = node("div", "output-stack"); outputStack.append(resourceField(recipe.result.item, value => recipe.result.item = value), numberField("产出数量", recipe.result.count, value => recipe.result.count = value, 1, 64));
      process.append(processDiagram(inputStack, middle, outputStack)); root.append(process);
    }

    function renderAlchemy(recipe, root) {
      const identity = section("基本信息"); identity.append(idFields(recipe, false));
      const row = node("div", "form-row"); row.append(field("锅内液体", select(recipe.liquid, state.liquids.map(value => [value.id, value.name]), value => recipe.liquid = value)), numberField("普通搅拌秒数", seconds(recipe.mixing_time), value => recipe.mixing_time = ticks(value), .05, 3600, .05), numberField("加糖搅拌秒数", seconds(recipe.sugar_mixing_time), value => recipe.sugar_mixing_time = ticks(value), .05, 3600, .05)); identity.append(row); root.append(identity);
      const inputs = section("四格材料");
      const rows = node("div", "ingredient-rows");
      recipe.ingredients.forEach((entry, index) => {
        const itemRow = node("div", "ingredient-row"); itemRow.append(ingredientControl(entry, next => Object.assign(entry, next)), input("number", entry.count, value => entry.count = value, { min: 1, max: 4 }));
        const remove = node("button", "icon-button danger", "×"); remove.type = "button"; remove.addEventListener("click", () => { recipe.ingredients.splice(index, 1); renderEditor(); }); itemRow.append(remove); rows.append(itemRow);
      });
      const add = node("button", "add-row", "＋ 添加材料"); add.type = "button"; add.addEventListener("click", () => { recipe.ingredients.push({ kind: "item", id: "minecraft:sugar", count: 1 }); renderEditor(); }); inputs.append(rows, add); root.append(inputs);
      const output = section("输出");
      output.append(segmented(recipe.result.type || "item", [["item", "普通物品"], ["sugar_pill", "药效糖丸"]], value => { recipe.result = value === "item" ? { type: "item", item: "candycraftmod:sugar_pill", count: 1 } : { type: "sugar_pill", count: 1, colors: ["#d94141", "#e2c64d", "#8a47c7", "#63b552"], effects: [] }; renderEditor(); }));
      if (recipe.result.type !== "sugar_pill") {
        const resultRow = node("div", "form-row result-row"); resultRow.append(field("输出物品", resourceField(recipe.result.item, value => recipe.result.item = value), "grow"), numberField("数量", recipe.result.count, value => recipe.result.count = value, 1, 64)); output.append(resultRow);
      } else {
        const colors = node("div", "pill-colors"); colors.append(node("span", "field-label", "糖丸四色"));
        recipe.result.colors = recipe.result.colors || ["#ffffff", "#ffffff", "#ffffff", "#ffffff"];
        recipe.result.colors.forEach((value, index) => colors.append(input("color", value, next => recipe.result.colors[index] = next))); output.append(colors);
        const effects = node("div", "effect-rows");
        (recipe.result.effects || []).forEach((effect, index) => {
          const effectRow = node("div", "effect-row"); effectRow.append(resourceField(effect.id, value => effect.id = value, "effect"), numberField("持续秒数", seconds(effect.duration), value => effect.duration = ticks(value), .05, 3600, .05).querySelector("input"), numberField("等级", Number(effect.amplifier || 0) + 1, value => effect.amplifier = Math.max(0, value - 1), 1, 256).querySelector("input"));
          const remove = node("button", "icon-button danger", "×"); remove.type = "button"; remove.addEventListener("click", () => { recipe.result.effects.splice(index, 1); renderEditor(); }); effectRow.append(remove); effects.append(effectRow);
        });
        const addEffect = node("button", "add-row", "＋ 添加药效"); addEffect.type = "button"; addEffect.addEventListener("click", () => { recipe.result.effects = recipe.result.effects || []; recipe.result.effects.push({ id: "minecraft:speed", duration: 1200, amplifier: 0 }); renderEditor(); }); output.append(effects, addEffect);
      }
      root.append(output);
    }

    function emptyRecipe(category) {
      if (category === "workbench") return { category, id: "new_recipe", file: null, mode: "shaped", group: "", book_category: "misc", cells: Array(9).fill(null), result: { item: "candycraftmod:sugar_pill", count: 1 } };
      if (category === "smelting") return { category, id: "new_smelting", file: null, group: "", book_category: "misc", ingredient: { kind: "item", id: "minecraft:sugar" }, result: { item: "candycraftmod:caramel_block", count: 1 }, experience: .7, cooking_time: 200 };
      if (category === "fuel") return { category, id: "new_fuel", file: null, ingredient: { kind: "item", id: "minecraft:sugar" }, burn_time: 300 };
      if (category === "sugar_factory") return { category, id: "new_factory_recipe", file: null, ingredient: { kind: "item", id: "minecraft:sugar" }, input_count: 1, result: { item: "candycraftmod:sugar_pill", count: 1 }, processing_time: 240, factory: "both" };
      return { category, id: "new_alchemy", file: null, liquid: "grenadine", mixing_time: 400, sugar_mixing_time: 200, ingredients: [{ kind: "item", id: "minecraft:sugar", count: 4 }], result: { type: "item", item: "candycraftmod:sugar_pill", count: 1 } };
    }

    function updateHeading() {
      $("editorKind").textContent = categoryNames[state.category];
      $("editorTitle").textContent = state.current?.id || "新配方";
      $("fileLabel").textContent = state.previousFile || "尚未保存";
    }

    function renderEditor() {
      closeMenus(); const root = $("editor"); root.replaceChildren(); updateHeading();
      const recipe = state.current;
      if (!recipe) return;
      if (state.category === "workbench") renderWorkbench(recipe, root);
      else if (state.category === "smelting") renderSmelting(recipe, root);
      else if (state.category === "fuel") renderFuel(recipe, root);
      else if (state.category === "alchemy") renderAlchemy(recipe, root);
      else renderSugarFactory(recipe, root);
    }

    function selectRecipe(recipe) {
      state.current = clone(recipe); state.previousFile = recipe.file || null; renderList(); renderEditor();
    }

    function renderList() {
      const query = $("searchInput").value.trim().toLowerCase();
      const values = (state.recipes[state.category] || []).filter(recipe => !query || recipe.id.toLowerCase().includes(query));
      $("recipeCount").textContent = `${values.length} 条配方`; const list = $("recipeList"); list.replaceChildren();
      for (const recipe of values) {
        const button = node("button", recipe.file === state.previousFile ? "recipe-entry active" : "recipe-entry"); button.type = "button";
        button.append(node("strong", "", recipe.id), node("small", "", recipe.file)); button.addEventListener("click", () => selectRecipe(recipe)); list.append(button);
      }
    }

    function renderTabs() {
      const tabs = $("machineTabs"); tabs.replaceChildren();
      for (const [id, label] of categories) {
        const button = node("button", id === state.category ? "active" : "", label); button.type = "button";
        button.addEventListener("click", () => { state.category = id; const first = state.recipes[id]?.[0]; selectRecipe(first || emptyRecipe(id)); renderTabs(); }); tabs.append(button);
      }
    }

    async function reload(selectFile = null) {
      const data = await api("/api/state"); Object.assign(state, { recipes: data.recipes, items: data.items, tags: data.tags, effects: data.effects, liquids: data.liquids });
      $("workspace").textContent = data.root;
      const selected = selectFile ? state.recipes[state.category].find(recipe => recipe.file === selectFile) : state.recipes[state.category]?.[0];
      selectRecipe(selected || emptyRecipe(state.category)); renderTabs();
    }

    $("newButton").addEventListener("click", () => selectRecipe(emptyRecipe(state.category)));
    $("duplicateButton").addEventListener("click", () => { if (!state.current) return; const copy = clone(state.current); copy.id = `${copy.id}_copy`; copy.file = null; state.previousFile = null; state.current = copy; renderList(); renderEditor(); });
    $("deleteButton").addEventListener("click", async () => {
      if (!state.previousFile) return status("尚未保存的配方无需删除", true);
      if (!confirm(`删除配方 ${state.current.id}？`)) return;
      try { await api("/api/delete", { category: state.category, file: state.previousFile }); status("配方已删除"); await reload(); } catch (error) { status(error.message, true); }
    });
    $("saveButton").addEventListener("click", async () => {
      try {
        const result = await api("/api/save", { category: state.category, previousFile: state.previousFile, recipe: state.current });
        status(`已保存 ${result.id}`); await reload(result.file);
      } catch (error) { status(error.message, true); }
    });
    $("searchInput").addEventListener("input", renderList);
    document.addEventListener("click", event => { if (!event.target.closest(".resource-field")) closeMenus(); });
    reload().catch(error => status(error.message, true));
  </script>
</body>
</html>
