<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CandyCraft 手持物变换编辑器</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.js"}}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brandMark"></span><strong>CandyCraft</strong><span>手持物变换编辑器</span></div>
    <div class="toolStrip" role="toolbar" aria-label="变换工具">
      <button class="iconButton active" data-mode="translate" title="移动 (G)" aria-label="移动">↔</button>
      <button class="iconButton" data-mode="rotate" title="旋转 (R)" aria-label="旋转">⟳</button>
      <button class="iconButton" data-mode="scale" title="缩放 (S)" aria-label="缩放">⤢</button>
      <span class="toolDivider"></span>
      <button class="textButton" id="frontView">正视图</button>
      <button class="textButton" id="sideView">侧视图</button>
      <button class="textButton" id="resetCamera">透视图</button>
    </div>
    <div class="status"><span id="renderDot"></span><span id="renderStatus">3D 视口初始化中</span></div>
  </header>

  <main class="workspace">
    <aside class="leftPanel">
      <section>
        <h2>场景</h2>
        <label for="entitySelect">实体</label>
        <select id="entitySelect">
          <option value="suguard">糖卫</option>
          <option value="boss_suguard">糖卫图腾</option>
          <option value="gingerbread">姜饼人</option>
        </select>
        <label for="itemSelect">手持物</label>
        <select id="itemSelect">
          <option value="caramel_bow">焦糖弓</option>
          <option value="licorice_spear">甘草长矛</option>
          <option value="jump_wand">跳跃法杖</option>
          <option value="honey_sword">蜂蜜剑</option>
          <option value="honey_pickaxe">蜂蜜镐</option>
          <option value="honey_hoe">蜂蜜锄</option>
          <option value="candy_cane">拐杖糖</option>
          <option value="dynamite">炸药</option>
          <option value="glue_dynamite">黏胶炸药</option>
        </select>
      </section>

      <section class="outliner">
        <h2>大纲</h2>
        <button class="treeRow" id="entityRow"><span class="eye">●</span><span class="cubeIcon"></span><span id="entityName">糖卫</span></button>
        <button class="treeRow selected" id="weaponRow"><span class="eye">●</span><span class="itemIcon"></span><span id="weaponName">焦糖弓</span></button>
      </section>

      <section>
        <h2>显示</h2>
        <label class="checkRow"><input id="showGrid" type="checkbox" checked><span>地面网格</span></label>
        <label class="checkRow"><input id="showBones" type="checkbox"><span>骨骼辅助线</span></label>
        <label class="checkRow"><input id="transparentEntity" type="checkbox"><span>实体半透明</span></label>
      </section>
    </aside>

    <section class="viewportPanel" aria-label="3D 视口">
      <div class="viewportTabs"><button class="active">3D 视图</button><span id="selectionLabel">已选择：焦糖弓</span></div>
      <div id="viewport">
        <canvas id="sceneCanvas"></canvas>
        <div class="axisLegend"><span class="axisX">X</span><span class="axisY">Y</span><span class="axisZ">Z</span></div>
        <div class="viewportHint" id="viewportHint">点击武器后拖动彩色轴</div>
      </div>
      <footer class="viewportFooter"><span id="leftMouseHint">空白处左键拖动旋转视角</span><span>右键旋转视角</span><span>滚轮缩放</span><span id="fpsLabel">0 FPS</span></footer>
    </section>

    <aside class="rightPanel">
      <section>
        <div class="sectionHeading"><h2>变换</h2><button class="miniButton" id="resetTransform">重置</button></div>
        <div class="vectorHeader"><span></span><span class="axisX">X</span><span class="axisY">Y</span><span class="axisZ">Z</span></div>
        <div class="vectorRow"><label>位置</label><input id="posX" type="number" step="0.0025"><input id="posY" type="number" step="0.0025"><input id="posZ" type="number" step="0.0025"></div>
        <div class="vectorRow"><label>旋转</label><input id="rotX" type="number" step="1"><input id="rotY" type="number" step="1"><input id="rotZ" type="number" step="1"></div>
        <div class="vectorRow"><label>缩放</label><input id="scaleX" type="number" step="0.025" min="0.025"><input id="scaleY" type="number" step="0.025" min="0.025"><input id="scaleZ" type="number" step="0.025" min="0.025"></div>
        <label class="checkRow compact"><input id="uniformScale" type="checkbox" checked><span>等比缩放</span></label>
      </section>

      <section>
        <h2>手部基点</h2>
        <p class="dataLine"><span>右臂附着</span><strong>right_arm</strong></p>
        <p class="dataLine"><span>变换组</span><strong id="transformGroupName">弓箭</strong></p>
        <p class="dataLine"><span>手部基点</span><strong id="handAnchorValue">0.0275 / 0.1225 / 0.1425</strong></p>
        <p class="dataLine"><span>显示上下文</span><strong>THIRD_PERSON_RIGHT_HAND</strong></p>
      </section>

      <section class="codeSection">
        <div class="sectionHeading"><h2>PoseStack 输出</h2><button class="miniButton" id="copyCode">复制</button></div>
        <pre id="codeOutput"></pre>
        <button class="primaryButton" id="exportJson">导出全部变换 JSON</button>
      </section>
    </aside>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
