<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CandyCraft 材质对比工作室</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.js"}}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">CC</span><div><strong>CandyCraft</strong><small>材质对比工作室</small></div></div>
    <nav class="tabs" aria-label="工作区">
      <button class="tab active" data-workspace="textures">材质对比</button>
      <button class="tab" data-workspace="entities">实体舞台</button>
    </nav>
    <div class="top-actions">
      <button id="refreshBtn" class="icon-button" title="重新扫描资源">↻</button>
      <button id="recordBtn" class="command">隐藏面板</button>
      <button id="fullscreenBtn" class="icon-button" title="全屏">⛶</button>
    </div>
  </header>

  <main id="textureWorkspace" class="workspace">
    <aside class="browser-panel">
      <div class="panel-title"><strong>材质</strong><span id="resultCount">0</span></div>
      <label class="search"><span>⌕</span><input id="searchInput" placeholder="搜索路径或名称"></label>
      <div class="filter-row">
        <select id="categoryFilter" title="材质分类">
          <option value="all">全部分类</option><option value="block">方块</option><option value="item">物品</option>
          <option value="entity">实体</option><option value="gui">界面</option><option value="particle">粒子</option>
          <option value="environment">环境</option><option value="other">其他</option>
        </select>
        <select id="statusFilter" title="变化状态">
          <option value="all">全部状态</option><option value="changed">已变化</option><option value="same">相同</option>
          <option value="classic-only">仅经典</option><option value="current-only">仅现有</option><option value="animated">动态</option>
        </select>
      </div>
      <div id="textureList" class="asset-list"></div>
    </aside>

    <section class="stage">
      <div class="stage-toolbar">
        <div class="segmented" id="viewMode">
          <button data-mode="side" class="active">并排</button><button data-mode="split">分割</button><button data-mode="blink">A/B</button>
        </div>
        <div class="stage-actions">
          <label class="compact-label">背景 <input id="backgroundColor" type="color" value="#25272a"></label>
          <button id="checkerBtn" class="icon-button active" title="透明棋盘格">▦</button>
          <button id="fitBtn" class="icon-button" title="适合画面">⊡</button>
          <button id="actualBtn" class="command">像素级</button>
        </div>
      </div>
      <div id="textureStage" class="texture-stage checker">
        <div id="sidePreview" class="side-preview">
          <figure><figcaption>经典材质</figcaption><canvas id="classicCanvas"></canvas><div class="empty-label">经典包中没有此材质</div></figure>
          <figure><figcaption>现有材质</figcaption><canvas id="currentCanvas"></canvas><div class="empty-label">现有资源中没有此材质</div></figure>
        </div>
        <div id="splitPreview" class="split-preview hidden">
          <canvas id="compareCanvas"></canvas>
          <span class="compare-label label-a">经典</span><span class="compare-label label-b">现有</span>
          <input id="splitRange" type="range" min="0" max="100" value="50" aria-label="分割位置">
        </div>
      </div>
      <div id="animationBar" class="animation-bar">
        <button id="prevFrame" class="icon-button" title="上一帧">|‹</button>
        <button id="playPause" class="icon-button" title="播放或暂停">Ⅱ</button>
        <button id="nextFrame" class="icon-button" title="下一帧">›|</button>
        <span id="frameText">静态材质</span>
        <input id="frameRange" type="range" min="0" max="0" value="0" aria-label="动画帧">
        <label>速度 <select id="speedSelect"><option value=".25">0.25×</option><option value=".5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
      </div>
    </section>

    <aside class="inspector">
      <div class="panel-title"><strong>检查器</strong><span id="statusBadge" class="badge">未选择</span></div>
      <h2 id="assetName">选择一张材质</h2>
      <p id="assetPath" class="asset-path">从左侧列表开始</p>
      <dl id="textureDetails" class="details"></dl>
      <div class="legend">
        <div><i class="dot changed"></i>内容已变化</div><div><i class="dot same"></i>两边相同</div>
        <div><i class="dot new"></i>单侧存在</div><div><i class="dot animated"></i>动态贴图</div>
      </div>
    </aside>
  </main>

  <main id="entityWorkspace" class="workspace entity-workspace hidden">
    <aside class="entity-controls">
      <div class="panel-title"><strong>实体模型</strong><span id="modelCount">0</span></div>
      <label>模型<select id="modelSelect"></select></label>
      <label>实体贴图<select id="entityTextureSelect"></select></label>
      <div class="section-label">显示版本</div>
      <div class="segmented full" id="entityEdition">
        <button data-edition="classic">经典</button><button data-edition="current" class="active">现有</button><button data-edition="blink">A/B</button>
      </div>
      <label>附加贴图层<select id="glowTextureSelect"><option value="">关闭</option></select></label>
      <label class="toggle-line"><input id="glowToggle" type="checkbox">显示附加层</label>
      <div class="section-label animation-heading">实体动画</div>
      <div id="entityAnimationList" class="entity-animation-list"></div>
      <div class="entity-animation-toolbar">
        <button id="entityAnimationRestart" class="icon-button" title="从头播放">↺</button>
        <button id="entityAnimationPlay" class="icon-button" title="暂停动画">Ⅱ</button>
        <span id="entityAnimationTime">0.00 / 0.00 秒</span>
        <select id="entityAnimationSpeed" title="动画速度">
          <option value=".25">0.25×</option><option value=".5">0.5×</option>
          <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
        </select>
      </div>
      <input id="entityAnimationRange" class="entity-animation-range" type="range" min="0" max="0" value="0" step=".01" aria-label="实体动画时间轴">
      <label class="toggle-line"><input id="turntableToggle" type="checkbox" checked>自动转台</label>
      <label>转速<input id="turntableSpeed" type="range" min="-2" max="2" value=".55" step=".05"></label>
      <div class="section-label">视角</div>
      <div class="view-buttons">
        <button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button data-view="perspective">透视</button>
      </div>
      <button id="resetCamera" class="wide-command">重置镜头</button>
      <p class="hint">拖动旋转，滚轮缩放，右键平移</p>
    </aside>
    <section id="entityStage" class="entity-stage">
      <canvas id="entityCanvas"></canvas>
      <div class="entity-overlay">
        <strong id="entityTitle">实体模型</strong><span id="entityEditionLabel">现有材质</span>
      </div>
      <div id="entityError" class="entity-error hidden"></div>
    </section>
    <aside class="entity-inspector">
      <div class="panel-title"><strong>模型信息</strong></div>
      <dl id="entityDetails" class="details"></dl>
      <div class="section-label">舞台背景</div>
      <div class="swatches" id="stageSwatches">
        <button data-color="#181a1c" style="--swatch:#181a1c" class="active" title="深灰"></button>
        <button data-color="#477b78" style="--swatch:#477b78" title="青绿"></button>
        <button data-color="#b8a46b" style="--swatch:#b8a46b" title="暖金"></button>
        <button data-color="#e2e0da" style="--swatch:#e2e0da" title="浅灰"></button>
      </div>
      <label class="toggle-line"><input id="gridToggle" type="checkbox" checked>显示地面网格</label>
      <label class="toggle-line"><input id="shadowToggle" type="checkbox" checked>显示接触阴影</label>
    </aside>
  </main>

  <div id="loading" class="loading"><div class="loader"></div><strong>正在扫描 CandyCraft 资源</strong></div>
  <script type="module" src="app.js"></script>
</body>
</html>
