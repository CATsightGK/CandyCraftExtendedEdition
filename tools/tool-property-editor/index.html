<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CandyCraft 工具属性编辑器</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">CC</div>
        <div><h1>工具属性编辑器</h1><p id="projectPath">正在连接工程...</p></div>
      </div>
      <div class="top-actions">
        <input id="importFile" type="file" accept="application/json,.json" hidden>
        <button id="importButton" type="button">导入</button>
        <button id="exportButton" type="button">导出</button>
        <button id="resetAllButton" type="button" class="danger-quiet">全部重置</button>
        <button id="saveButton" type="button" class="primary">保存属性</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="item-sidebar">
        <div class="sidebar-tools">
          <input id="searchInput" type="search" placeholder="搜索名称或注册名">
          <div id="filters" class="segments" aria-label="物品分类"></div>
        </div>
        <div class="list-summary"><span id="itemCount">0 项</span><span id="dirtyCount">未修改</span></div>
        <div id="itemList" class="item-list"></div>
      </aside>

      <main class="editor-pane">
        <div id="emptyState" class="empty-state">选择一个工具</div>
        <div id="editor" hidden>
          <section class="item-heading">
            <div class="item-icon-frame"><img id="selectedIcon" alt=""></div>
            <div><div id="selectedCategory" class="eyebrow"></div><h2 id="selectedName"></h2><code id="selectedId"></code></div>
            <button id="resetSelectedButton" type="button">重置此物品</button>
          </section>

          <section class="editor-section">
            <div class="section-title"><h3>基础属性</h3><span id="statHint"></span></div>
            <div id="statGrid" class="stat-grid"></div>
          </section>

          <section class="editor-section enchant-section">
            <div class="section-title">
              <div><h3>可用附魔</h3><span id="enchantCount"></span></div>
              <label class="switch"><input id="vanillaEnchantToggle" type="checkbox"><span></span>遵循原版判定</label>
            </div>
            <input id="enchantSearch" class="enchant-search" type="search" placeholder="搜索附魔">
            <div id="enchantmentGrid" class="enchantment-grid"></div>
          </section>
        </div>
      </main>

      <aside class="reference-pane">
        <div class="reference-header"><span>原版属性参考</span><select id="referenceSelect"></select></div>
        <div id="referenceVisual" class="reference-visual"></div>
        <div id="comparisonTable" class="comparison-table"></div>
      </aside>
    </div>
    <footer><span id="statusText">正在加载</span><span id="configPath"></span></footer>
  </div>
  <div id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
