plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'candycraft'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:15.20.0.132")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:15.20.0.132")
}

mixin {
    add sourceSets.main, 'candycraftmod.refmap.json'
    config 'candycraftmod.mixins.json'
}

tasks.withType(ProcessResources).configureEach {
    def classicPackPrefix = 'resourcepacks/candycraft_classic/'
    def primaryResources = project.layout.projectDirectory.dir('src/main/resources').asFile
    def classicPackBuildOnlyExtensions = [
        '.java', '.class', '.jar', '.gradle', '.bbmodel', '.bak', '.tmp',
        '.psd', '.xcf', '.zip', '.7z', '.rar', '.orig', '.rej'
    ]

    exclude { details ->
        def resourcePath = details.path.replace('\\', '/')
        if (!resourcePath.startsWith(classicPackPrefix) || details.directory) {
            return false
        }

        def lowerName = details.name.toLowerCase(Locale.ROOT)
        if (classicPackBuildOnlyExtensions.any { lowerName.endsWith(it) } || lowerName.endsWith('~')) {
            return true
        }

        // A resource pack falls back to the mod's default assets. Do not store
        // byte-identical classic-pack copies a second time in the distributable.
        def fallback = new File(primaryResources, resourcePath.substring(classicPackPrefix.length()))
        return fallback.isFile()
            && details.file.length() == fallback.length()
            && java.nio.file.Files.mismatch(details.file.toPath(), fallback.toPath()) == -1L
    }

    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    // MixinGradle's incremental addMixinsToJar task can leave the generated
    // refmap out of the distributable. Include it directly as a jar input.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(layout.buildDirectory.file('tmp/compileJava/candycraftmod.refmap.json'))

    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : mod_authors,
            'MixinConfigs'            : 'candycraftmod.mixins.json'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
